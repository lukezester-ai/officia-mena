name: CI

on:
  pull_request:
  push:
    branches: [main, officia-main, codex/security-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=public-chromium
        env:
          PLAYWRIGHT_BASE_URL: https://officia-mena.com
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
